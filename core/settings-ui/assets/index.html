<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="nagi-token" content="{{TOKEN}}">
<title>Nagi 設定</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg?t={{TOKEN}}">
<link rel="stylesheet" href="/app.css?t={{TOKEN}}">
<link rel="stylesheet" href="/userdict.css?t={{TOKEN}}">
<link rel="stylesheet" href="/backup.css?t={{TOKEN}}">
<link rel="stylesheet" href="/motion.css?t={{TOKEN}}">
<script src="/keymap.js?t={{TOKEN}}" defer></script>
<script src="/userdict.js?t={{TOKEN}}" defer></script>
<script src="/backup.js?t={{TOKEN}}" defer></script>
<script src="/app.js?t={{TOKEN}}" defer></script>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="設定のページ">
    <div class="brand">
      <img class="brand-mark" src="/icon.svg?t={{TOKEN}}" alt="" width="40" height="40">
      <div class="brand-text">
        <span class="brand-name">Nagi</span>
        <span class="brand-sub">設定 <span id="app-version"></span></span>
      </div>
    </div>
    <div id="nav" class="nav-scroll"></div>
    <div class="side-foot">
      <label class="switch-line" for="detail-toggle">
        <span class="switch-line-text">詳細設定を表示</span>
        <input type="checkbox" role="switch" class="switch" id="detail-toggle">
      </label>
    </div>
  </nav>
  <main id="main" class="main" aria-labelledby="page-title" tabindex="-1">
    <div class="main-inner">
      <div id="banner" class="banner" role="alert" hidden></div>
      <div id="page" class="page"></div>
    </div>
  </main>
</div>
<div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
<div id="sr-live" class="sr-only" role="status" aria-live="polite"></div>
<dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-body">
  <div class="dialog-body">
    <h2 id="confirm-title">学習データを全削除しますか？</h2>
    <p id="confirm-body">これまでの変換の学習（よく使う変換・次語予測）がすべて消えます。この操作は取り消せません。ユーザー辞書は消えません。</p>
    <div class="buttons end">
      <button type="button" class="btn" id="confirm-cancel" autofocus>キャンセル</button>
      <button type="button" class="btn danger" id="confirm-ok">削除する</button>
    </div>
  </div>
</dialog>
<dialog id="copy-dialog" aria-labelledby="copy-title">
  <div class="dialog-body wide">
    <h2 id="copy-title">レポートを選択しました</h2>
    <p>自動でコピーできませんでした。下の文章を選択済みです。Ctrl+C でコピーしてください。</p>
    <label class="sr-only" for="copy-text">診断レポート</label>
    <textarea id="copy-text" class="report-text" readonly rows="14" spellcheck="false"></textarea>
    <div class="buttons end">
      <button type="button" class="btn primary" id="copy-close" autofocus>閉じる</button>
    </div>
  </div>
</dialog>
</body>
</html>
