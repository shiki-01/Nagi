name: windows-release

# Windows 版（TSF の DLL + imserver.exe + nagi-settings.exe、LLM 有効）を MSVC でビルドし、zip にまとめて GitHub Releases に公開する。
# x64（windows-latest）と ARM64（windows-11-arm のネイティブランナー）を別々にビルドし、1 つのリリース
# windows-vX.Y.Z に両方を載せる。アセット:
#   x64:   Nagi-windows-X.Y.Z.zip        + latest.json        （0.1.15 以前のクライアントが参照する名前。変えない）
#   ARM64: Nagi-windows-arm64-X.Y.Z.zip  + latest-arm64.json
# 両方の zip を展開して、1 個のセットアップ exe（Nagi-setup-X.Y.Z.exe。Inno Setup。x64 / ARM64 共通）も作り、
# 同じリリースに載せる（installer ジョブ。frontend-windows/installer/nagi.iss）。exe は導入の入口で、
# 配置などの実処理は zip 内の install.ps1 が正（自動更新は zip 経由のまま）。
# あわせて ed25519 署名つきの latest*.json を作り、サイト（nagi.shiki-01.com/updates/windows/latest*.json）に載せる
# ため web ワークフローを起動する（web が最新の windows-v* リリースから latest*.json を取り込む）。
# 方針は docs/decisions.md H-42（ARM64 の追加は同 H-104）。
#
# ジョブの流れ:
#   prepare → build（x64 / ARM64。未署名の dll / exe を artifact に上げる）
#           → sign（SignPath。両アーキテクチャの中身を 1 回の要求で署名。Secrets が無ければ skip）
#           → bundle（署名後の中身から zip・SHA256SUMS・latest*.json の ed25519 署名を作る）
#           → installer（setup exe を作る）→ sign-installer（SignPath。skip 可）→ release
# zip のハッシュと ed25519 署名は必ず署名「後」の中身から作る（順序を変えると自動更新の検証が壊れる）。
#
# Authenticode 署名は SignPath Foundation（OSS 無料）。手順・Secrets・Variables は docs/code-signing.md、
# SignPath 側に貼る設定は .signpath/*.xml。次が揃っているときだけ署名する（無ければ署名なしで従来どおり配布）:
#   Secret   SIGNPATH_API_TOKEN
#   Variable SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG / SIGNPATH_SIGNING_POLICY_SLUG /
#            SIGNPATH_ARTIFACT_CONFIGURATION_SLUG（中身用）/ SIGNPATH_ARTIFACT_CONFIGURATION_SETUP_SLUG（setup exe 用。省略時 windows-setup）
# SignPath は 1 回の要求ごとに手動承認が要る。承認は 2 回（中身 1 回 + setup exe 1 回）。
# 旧方式（自前の証明書 .pfx。SignPath が使えないとき用。SignPath で署名したときは使わない）:
#   WINDOWS_CODESIGN_PFX           コード署名証明書（秘密鍵つき）の .pfx を base64 にしたもの
#   WINDOWS_CODESIGN_PFX_PASSWORD  上の .pfx のパスワード
# 必須の Secrets:
#   NAGI_UPDATE_SIGNING_KEY        アップデート署名用 ed25519 秘密鍵（`cargo xtask gen-update-key` の出力。macOS と共通）
#
# リリース手順:
#   1. core/Cargo.toml の [workspace.package] version を上げて main にコミットする
#   2. gh workflow run windows-release.yml --ref main
#      （リリースするバージョンは core/Cargo.toml の version から自動で決める。入力は不要。
#       タグ windows-vX.Y.Z はこのワークフローが作る）
#   実機で未検証の間は prerelease（既定）にしておく。prerelease は web ワークフローの latest.json の取り込み対象外なので、
#   サイトの更新確認・インストールコマンドには出ない。実機で確認できたら -f prerelease=false で公開する。
#   公開せずビルドだけ試すときは -f publish=false（成果物は Actions の artifact に残る）。
#   x64 だけにするときは -f arm64=false。

on:
  workflow_dispatch:
    inputs:
      llama:
        description: "imserver を LLM（llama.cpp）有効でビルドする"
        type: boolean
        default: true
      arm64:
        description: "ARM64 版もビルドして同じリリースに載せる（windows-11-arm ランナーが使えないときは false）"
        type: boolean
        default: true
      publish:
        description: "GitHub Releases に公開する（false なら artifact だけ）"
        type: boolean
        default: true
      prerelease:
        description: "prerelease として公開する（実機で未検証の間は true）"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  # バージョンの決定・リリース済みの確認・Secrets の確認（1 回だけ）
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_signpath: ${{ steps.secrets.outputs.has_signpath }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml)
        working-directory: core
        run: rustup show active-toolchain || rustup toolchain install

      - name: バージョンの決定（core/Cargo.toml の version から）
        id: version
        working-directory: core
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "xtask") | .version' | tr -d '\r')
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::core/Cargo.toml の version が X.Y.Z 形式ではありません: $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::リリースするバージョン: $VERSION"
          if [ "${{ inputs.publish }}" = "true" ] && gh release view "windows-v$VERSION" >/dev/null 2>&1; then
            echo "::error::リリース windows-v$VERSION は作成済みです。core/Cargo.toml の version を上げてください"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # ジョブの if では secrets を直接参照できないため、ここで有無を output にして後続ジョブが使う
      - name: Secrets の確認
        id: secrets
        env:
          SIGNING_KEY: ${{ secrets.NAGI_UPDATE_SIGNING_KEY }}
          PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "::error::Secrets が未設定です: NAGI_UPDATE_SIGNING_KEY"; exit 1; }
          if [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then
            echo "has_signpath=true" >> "$GITHUB_OUTPUT"
            echo "::notice::SignPath で Authenticode 署名します（SignPath の画面で承認が 2 回必要です）"
          else
            echo "has_signpath=false" >> "$GITHUB_OUTPUT"
            if [ -z "$PFX" ]; then
              echo "::notice::SignPath（SIGNPATH_API_TOKEN と変数 SIGNPATH_ORGANIZATION_ID）も WINDOWS_CODESIGN_PFX も未設定のため、Authenticode 署名なしでビルドします（SmartScreen の警告が出る配布物になります）"
            fi
          fi

      # arch: xtask の --arch / zip: zip のファイル名の先頭 / manifest: latest.json のファイル名
      # ARM64 は x64 ランナーからのクロスではなく、ネイティブの windows-11-arm ランナーでビルドする
      # （llama.cpp の cmake・libclang をクロスで設定せずに済む。ランナーで ARM64 の DLL を実際に登録できる）
      - name: ビルド対象の一覧
        id: matrix
        run: |
          x64='{"arch":"x86_64","runner":"windows-latest","target":"x86_64-pc-windows-msvc","zip":"Nagi-windows","manifest":"latest.json"}'
          arm='{"arch":"aarch64","runner":"windows-11-arm","target":"aarch64-pc-windows-msvc","zip":"Nagi-windows-arm64","manifest":"latest-arm64.json"}'
          if [ "${{ inputs.arm64 }}" = "true" ]; then
            echo "matrix={\"include\":[$x64,$arm]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$x64]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.prepare.outputs.version }}
      ZIP_NAME: ${{ matrix.zip }}-${{ needs.prepare.outputs.version }}.zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml)
        working-directory: core
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: windows-release-${{ matrix.arch }}-${{ inputs.llama }}

      # windows-latest は x64 の LLVM、windows-11-arm は ARM64 の LLVM が入っている前提。
      # ビルドスクリプト（bindgen）はランナーと同じアーキテクチャの libclang.dll を読むので、PE の Machine を確かめる
      - name: libclang の場所（llama のとき）
        if: inputs.llama
        run: |
          want=${{ matrix.arch }}
          for d in "/c/Program Files/LLVM/bin" "/c/Program Files (x86)/LLVM/bin"; do
            if [ -e "$d/libclang.dll" ]; then
              machine=$(od -An -tx2 -j "$(( $(od -An -tu4 -j 60 -N 4 "$d/libclang.dll") + 4 ))" -N 2 "$d/libclang.dll" | tr -d ' ')
              echo "$d/libclang.dll Machine=0x$machine"
              case "$want:$machine" in
                x86_64:8664|aarch64:aa64) echo "LIBCLANG_PATH=$(cygpath -w "$d")" >> "$GITHUB_ENV"; found=1; break ;;
              esac
            fi
          done
          [ -n "$found" ] || { echo "::error::$want 用の libclang.dll が見つかりません（-f llama=false で LLM なしにできます）"; exit 1; }

      # DLL はあらゆるホストプロセスに読み込まれるため、Visual C++ ランタイムに依存しないよう CRT を静的リンクする。
      # --target を明示すると RUSTFLAGS はビルドスクリプト・proc-macro（ホスト側）には掛からない。
      - name: TSF の DLL をビルド（CRT 静的リンク）
        working-directory: core
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --target "$TARGET" -p nagi-windows-tsf

      # imserver は llama.cpp（C++）を含むため CRT は既定（動的）のまま。Visual C++ 再頒布可能パッケージを前提にする
      # （install.ps1 が確認して警告を出す。ARM64 は vc_redist.arm64.exe）。静的リンクは llama-cpp-sys-2 の
      # LLAMA_STATIC_CRT で可能だが未検証。
      # llama.cpp（ggml-cpu）は ARM64 の MSVC（cl.exe）を拒否する（"MSVC is not supported for ARM, use clang"）。
      # ARM64 だけ VS の開発者環境（INCLUDE/LIB・Ninja）を読み込み、Ninja + clang-cl でビルドする（H-107）。
      # cmake クレートは CMAKE_GENERATOR、cc クレートは CC/CXX の環境変数に従う
      - name: ARM64 の C/C++ を clang-cl にする（llama のとき）
        if: inputs.llama && matrix.arch == 'aarch64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: ARM64 の clang-cl・Ninja の設定（llama のとき）
        if: inputs.llama && matrix.arch == 'aarch64'
        run: |
          # 開発者環境を読み込むと rustc が PATH 上の link.exe を使うが、bash では Git の /usr/bin/link（coreutils）が
          # 先に見つかってリンクが失敗する。ランナー上だけの退避なので後片付けは不要
          if [ -e /usr/bin/link.exe ]; then mv /usr/bin/link.exe /usr/bin/link-coreutils.exe; fi
          echo "$LIBCLANG_PATH" >> "$GITHUB_PATH"
          {
            echo "CMAKE_GENERATOR=Ninja"
            echo "CC_aarch64_pc_windows_msvc=clang-cl"
            echo "CXX_aarch64_pc_windows_msvc=clang-cl"
            # clang-cl は既定で C++ 例外が無効（cl.exe と違い cc クレートが /EHsc を足さない）。llama-cpp-sys-2 の
            # wrapper_common.cpp が try/throw を使うため明示する。`/EHsc` と書くと MSYS の bash がパスとみなして
            # `C:/Program Files/Git/EHsc` に書き換えるので、clang-cl が受け付ける `-EHsc` の形で渡す
            echo "CXXFLAGS_aarch64_pc_windows_msvc=-EHsc"
          } >> "$GITHUB_ENV"
          # clang-cl の OpenMP は LLVM のランタイム（libomp の __kmpc_*）を要し、ランナーにも配布物にも無いため
          # リンクで失敗する。ARM64 だけ cmake に OpenMP を見つけさせず、ggml 自前のスレッドプールを使う
          # （macOS と同じ経路。ggml は OpenMP が見つからなければ警告して OpenMP なしで続行する）。
          # toolchain ファイルを渡すと cmake クレートはコンパイラを指定しなくなるので、ここで clang-cl を指定する
          tc="$RUNNER_TEMP/nagi-arm64-toolchain.cmake"
          cat > "$tc" <<'EOF'
          set(CMAKE_C_COMPILER clang-cl)
          set(CMAKE_CXX_COMPILER clang-cl)
          set(CMAKE_DISABLE_FIND_PACKAGE_OpenMP TRUE)
          EOF
          echo "CMAKE_TOOLCHAIN_FILE_aarch64_pc_windows_msvc=$(cygpath -m "$tc")" >> "$GITHUB_ENV"
          cat "$tc"
          "$(cygpath -u "$LIBCLANG_PATH")/clang-cl.exe" --version
          command -v ninja || { echo "::error::ninja が見つかりません"; exit 1; }

      - name: imserver をビルド
        working-directory: core
        run: |
          features=()
          if [ "${{ inputs.llama }}" = "true" ]; then features=(--features llama); fi
          cargo build --release --target "$TARGET" -p nagi-server --bin imserver "${features[@]}"

      # 設定画面（nagi-settings.exe。ローカルの Web 画面。H-97）。LLM（llama）は不要なので imserver とは別に
      # ビルドする（`--features llama` を -p の複数指定に付けると settings-ui に feature が無くて失敗する）。
      # 純 Rust なので CRT は静的リンクにして、再頒布可能パッケージなしでも起動できるようにする
      - name: 設定画面（nagi-settings）をビルド
        working-directory: core
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --target "$TARGET" -p nagi-settings-ui

      # 未署名の中身（TSF の DLL・imserver.exe・nagi-settings.exe）を artifact に上げる。zip 化・チェックサム・
      # latest.json は署名の後（bundle ジョブ）。bin/<arch>/ の構成は署名の前後で揃える
      - name: 中身を集める（未署名）
        run: |
          mkdir -p "bin/${{ matrix.arch }}"
          for f in nagi_windows_tsf.dll imserver.exe nagi-settings.exe; do
            cp "core/target/$TARGET/release/$f" "bin/${{ matrix.arch }}/$f"
          done
          ls -l "bin/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-bin-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}
          path: bin
          if-no-files-found: error

  # 両アーキテクチャの中身を 1 回の SignPath 要求で署名する（承認 1 回）。SignPath の Secrets が無いときは skip
  # （bundle ジョブが未署名の artifact をそのまま使う）。署名を設定しているのに失敗したときは、bundle 以降も
  # 走らせない（未署名のものを黙って公開しない）
  sign:
    needs: [prepare, build]
    if: needs.prepare.outputs.has_signpath == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-bin-*-${{ needs.prepare.outputs.version }}
          path: sign-input
          merge-multiple: true

      - name: 署名対象の確認
        run: find sign-input -type f | sort

      - name: SignPath に送る
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: sign-input-${{ needs.prepare.outputs.version }}
          path: sign-input
          if-no-files-found: error

      # TODO: action のバージョンは実際の最新を action.yml / リリースで確認して上げる（v1 系の入力名で書いている）。
      # 入力名（wait-for-completion-timeout-in-seconds など）は公式 README と照合すること
      - name: SignPath で署名（手動承認待ち）
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-bin

      - name: 署名後の確認（ファイルが揃っているか）
        run: |
          find signed-bin -type f | sort
          for f in $(cd sign-input && find . -type f); do
            [ -f "signed-bin/$f" ] || { echo "::error::署名後の成果物に $f がありません"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: signed-bin-${{ needs.prepare.outputs.version }}
          path: signed-bin
          if-no-files-found: error

  # 署名後（SignPath を使わないときは署名なし）の中身から、zip・SHA256SUMS・latest*.json（ed25519 署名）を作る。
  # sign が skip のときも動く（署名に失敗した・キャンセルされたときは動かさない）
  bundle:
    needs: [prepare, build, sign]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    name: bundle (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.prepare.outputs.version }}
      ZIP_NAME: ${{ matrix.zip }}-${{ needs.prepare.outputs.version }}.zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml)
        working-directory: core
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: windows-release-bundle-${{ matrix.arch }}

      # 署名したときは署名後（bin/<arch>/ を含む全アーキテクチャ分）、しなかったときは build の未署名の中身
      - uses: actions/download-artifact@v4
        if: needs.sign.result == 'success'
        with:
          name: signed-bin-${{ needs.prepare.outputs.version }}
          path: bin

      - uses: actions/download-artifact@v4
        if: needs.sign.result != 'success'
        with:
          name: unsigned-bin-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}
          path: bin

      - name: 署名の確認（SignPath で署名したとき）
        if: needs.sign.result == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in 'nagi_windows_tsf.dll', 'imserver.exe', 'nagi-settings.exe') {
            $p = "bin/${{ matrix.arch }}/$f"
            $sig = Get-AuthenticodeSignature -LiteralPath $p
            Write-Host "$p : $($sig.Status) $($sig.SignerCertificate.Subject)"
            if (-not $sig.SignerCertificate) { throw "$p に署名がありません" }
          }

      # 旧方式（自前の .pfx）。SignPath で署名したときは使わない（二重署名を避ける）
      - name: Authenticode 署名の準備（.pfx があるときだけ）
        id: codesign
        env:
          PFX: ${{ needs.sign.result != 'success' && secrets.WINDOWS_CODESIGN_PFX || '' }}
        run: |
          if [ -z "$PFX" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$PFX" | base64 --decode > "$RUNNER_TEMP/codesign.pfx"
          # signtool はビルドの対象ではなくランナーで動くもの（ARM64 ランナーでは arm64 が無ければ x64 をエミュレーションで使う）
          signtool=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"*/${{ matrix.arch == 'aarch64' && 'arm64' || 'x64' }}/signtool.exe "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe 2>/dev/null | sort -V | tail -n 1)
          [ -n "$signtool" ] || { echo "::error::signtool.exe が見つかりません"; exit 1; }
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "signtool=$(cygpath -w "$signtool")" >> "$GITHUB_OUTPUT"
          echo "pfx=$(cygpath -w "$RUNNER_TEMP/codesign.pfx")" >> "$GITHUB_OUTPUT"

      - name: bundle（収集・チェックサム・zip。中身は署名後のものを使う）
        working-directory: core
        env:
          NAGI_WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          sign=()
          if [ "${{ steps.codesign.outputs.enabled }}" = "true" ]; then
            sign=(--sign-pfx "${{ steps.codesign.outputs.pfx }}" --signtool "${{ steps.codesign.outputs.signtool }}")
          fi
          bin="$GITHUB_WORKSPACE/bin/${{ matrix.arch }}"
          cargo xtask bundle-windows --arch "${{ matrix.arch }}" --target "$TARGET" \
            --dll "$bin/nagi_windows_tsf.dll" --imserver "$bin/imserver.exe" --settings "$bin/nagi-settings.exe" \
            "${sign[@]}"
          cp "target/windows-bundle/$ZIP_NAME" "../$ZIP_NAME"

      # install.ps1 / uninstall.ps1 の実行確認（regsvr32 の登録と解除を含む）。ランナーでの TSF 登録が
      # 通るかは未確認のため、失敗しても警告に留める（実機の検証項目: docs/real-hardware-checklist.md §8.7）
      # ARM64 は、ランナーが ARM64 なので ARM64 の DLL がそのまま登録できる
      - name: インストーラのスモークテスト（失敗は警告）
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'smoke'
          Expand-Archive -LiteralPath $env:ZIP_NAME -DestinationPath $root
          $dir = Join-Path $root "Nagi-windows-$env:VERSION"
          $dest = Join-Path $env:RUNNER_TEMP 'NagiInstalled'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'install.ps1') -SkipData -InstallDir $dest
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 が失敗しました ($LASTEXITCODE)" }
          if (-not (Test-Path (Join-Path $dest 'nagi_windows_tsf.dll'))) { throw 'DLL が配置されていません' }
          if (-not (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Nagi')) { throw '「アプリと機能」の項目がありません' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dest 'uninstall.ps1') -InstallDir $dest
          if ($LASTEXITCODE -ne 0) { throw "uninstall.ps1 が失敗しました ($LASTEXITCODE)" }
          Write-Host 'スモークテスト OK'

      - name: latest.json（ed25519 署名つき）
        working-directory: core
        env:
          NAGI_UPDATE_SIGNING_KEY: ${{ secrets.NAGI_UPDATE_SIGNING_KEY }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases"
          cargo xtask sign-update \
            --file "../$ZIP_NAME" \
            --version "$VERSION" \
            --download-url "$base/download/windows-v$VERSION/$ZIP_NAME" \
            --notes-url "$base/tag/windows-v$VERSION" \
            --out "../${{ matrix.manifest }}"
          cat "../${{ matrix.manifest }}"

      - uses: actions/upload-artifact@v4
        with:
          name: nagi-windows-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ matrix.manifest }}

      - name: 後片付け
        if: always()
        run: rm -f "$RUNNER_TEMP/codesign.pfx"

  # 両アーキテクチャの zip を展開して、1 個のセットアップ exe（Inno Setup）を作る。
  # publish=false でも走らせる（artifact の exe を落として試せる）
  installer:
    needs: [prepare, bundle]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: nagi-windows-*-${{ needs.prepare.outputs.version }}
          path: artifacts
          merge-multiple: true

      - name: zip を展開する（x64 / ARM64）
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem artifacts | Format-Table Name, Length
          Expand-Archive -LiteralPath "artifacts/Nagi-windows-$env:VERSION.zip" -DestinationPath payload-x64
          if ('${{ inputs.arm64 }}' -eq 'true') {
            Expand-Archive -LiteralPath "artifacts/Nagi-windows-arm64-$env:VERSION.zip" -DestinationPath payload-arm64
          }

      # windows-latest のイメージに Inno Setup が入っていればそれを使い、無ければ Chocolatey で入れる。
      # nagi.iss は x64compatible / x64os / IsArm64（Inno Setup 6.3 以降）を使う
      - name: Inno Setup の用意
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe が見つかりません' }
          $v = [version]$iscc.VersionInfo.ProductVersion
          Write-Host "ISCC: $($iscc.FullName) ($v)"
          if ($v -lt [version]'6.3') { throw "Inno Setup 6.3 以降が必要です（$v）" }
          if (-not (Test-Path (Join-Path $iscc.DirectoryName 'Languages\Japanese.isl'))) { throw 'Japanese.isl が見つかりません' }
          "ISCC=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # setup exe の署名は、このジョブの後の sign-installer ジョブ（SignPath）で行う。SignPath はコマンドラインの
      # signtool 形式ではないため、iscc に /DSignToolName は渡さない（setup exe 本体だけが署名され、
      # 内部のアンインストーラ uninst*.exe は署名されない。中身の dll / exe は署名済みの zip から来る）

      - name: セットアップ exe をビルドする
        run: |
          $ErrorActionPreference = 'Stop'
          $x64 = (Resolve-Path "payload-x64/Nagi-windows-$env:VERSION").Path
          $isccArgs = @("/DAppVersion=$env:VERSION", "/DSrcX64=$x64", "/DOutputDir=$((Resolve-Path .).Path)\installer-out")
          if ('${{ inputs.arm64 }}' -eq 'true') {
            $isccArgs += "/DSrcArm64=$((Resolve-Path "payload-arm64/Nagi-windows-$env:VERSION").Path)"
          }
          $isccArgs += (Resolve-Path 'frontend-windows/installer/nagi.iss').Path
          & $env:ISCC @isccArgs
          if ($LASTEXITCODE -ne 0) { throw "iscc が失敗しました ($LASTEXITCODE)" }
          Get-ChildItem installer-out | Format-Table Name, Length

      # SignPath を使わないときは、そのまま公開用の artifact にする
      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.has_signpath != 'true'
        with:
          name: nagi-setup-${{ needs.prepare.outputs.version }}
          path: installer-out/Nagi-setup-${{ needs.prepare.outputs.version }}.exe

      # SignPath を使うときは、署名前の exe を別名で上げる（release が拾う nagi-setup-* と名前を分ける）
      - name: 署名前の setup exe を上げる
        id: unsigned
        if: needs.prepare.outputs.has_signpath == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup-${{ needs.prepare.outputs.version }}
          path: installer-out/Nagi-setup-${{ needs.prepare.outputs.version }}.exe
          if-no-files-found: error
    outputs:
      unsigned_artifact_id: ${{ steps.unsigned.outputs.artifact-id }}

  # setup exe を SignPath で署名する（承認 1 回）。SignPath の Secrets が無いときは skip
  sign-installer:
    needs: [prepare, installer]
    if: needs.prepare.outputs.has_signpath == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # TODO: sign ジョブと同じく、action のバージョン・入力名を公式で確認する
      - name: SignPath で署名（手動承認待ち）
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SETUP_SLUG || 'windows-setup' }}
          github-artifact-id: ${{ needs.installer.outputs.unsigned_artifact_id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup

      - name: 署名後の確認
        run: |
          ls -l signed-setup
          [ -f "signed-setup/Nagi-setup-${{ needs.prepare.outputs.version }}.exe" ] || { echo "::error::署名後の setup exe がありません"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: nagi-setup-${{ needs.prepare.outputs.version }}
          path: signed-setup/Nagi-setup-${{ needs.prepare.outputs.version }}.exe
          if-no-files-found: error

  # すべてのビルドが成功したときだけ、1 つのリリースに全アーキテクチャの zip と latest*.json を載せる
  release:
    needs: [prepare, bundle, installer, sign-installer]
    if: ${{ !cancelled() && inputs.publish && needs.bundle.result == 'success' && needs.installer.result == 'success' && (needs.sign-installer.result == 'success' || needs.sign-installer.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nagi-{windows,setup}-*${{ needs.prepare.outputs.version }}
          merge-multiple: true

      - name: GitHub Releases に公開
        run: |
          ls -l
          flags=()
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags=(--prerelease); fi
          assets=("Nagi-windows-$VERSION.zip" latest.json "Nagi-setup-$VERSION.exe")
          if [ "${{ inputs.arm64 }}" = "true" ]; then assets+=("Nagi-windows-arm64-$VERSION.zip" latest-arm64.json); fi
          gh release create "windows-v$VERSION" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "Nagi for Windows $VERSION" \
            "${flags[@]}" \
            --notes "Windows 10 22H2 以降 / 11（x64: Nagi-windows-$VERSION.zip、ARM64: Nagi-windows-arm64-$VERSION.zip）。Authenticode 署名は SignPath Foundation の署名がある版のみ（無い版では SmartScreen の警告が出ることがあります。手順: docs/windows-install.md、方針: docs/code-signing.md）。インストール: ダブルクリックで導入できる Nagi-setup-$VERSION.exe（x64 / ARM64 共通。署名が無い版は SmartScreen で「詳細情報 → 実行」）、または PowerShell で \`irm https://nagi.shiki-01.com/install.ps1 | iex\`（CPU に合う版と、辞書・モデルを自動で取得する）。実機で未検証の版は prerelease。ARM64 版は ARM64 ネイティブのアプリだけで使える（x64 エミュレーションのアプリには出ない）。"

      - name: サイトの latest.json を更新（web ワークフローを起動）
        if: "!inputs.prerelease"
        run: gh workflow run web.yml --ref main
