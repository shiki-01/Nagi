name: android-check

# Android アプリ（frontend-android）の Kotlin が通るかだけを素早く確認する（コア・辞書は含めない）。
# Kotlin はローカルでコンパイルできないため、frontend-android を触る push では必ずこれが緑になることを確認する。

on:
  push:
    paths:
      - "frontend-android/**"
      - ".github/workflows/android-check.yml"
  workflow_dispatch:

concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: NOTICE を assets へ配置
        run: |
          mkdir -p frontend-android/app/src/main/assets
          cp NOTICE frontend-android/app/src/main/assets/NOTICE.txt
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin のコンパイルと lint 相当
        working-directory: frontend-android
        run: ./gradlew --no-daemon compileReleaseKotlin testReleaseUnitTest
